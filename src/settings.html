<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fernkin settings</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="settings-shell">
    <a class="back-link" href="./index.html">← Back to the notepad</a>
    <p class="eyebrow">Make it yours</p>
    <h1>Session settings</h1>
    <p class="settings-intro">Choose how long the quiet pause should be before Fernkin checks in.</p>
    <form id="settings-form" class="settings-card">
      <label for="threshold">Inactivity threshold <span>(minutes)</span></label>
      <input id="threshold" name="threshold" type="number" min="1" max="120" step="1" required>
      <p class="field-help">The default is 15 minutes. Your choice applies to new sessions.</p>
      <button class="primary" type="submit">Save settings</button>
      <p id="settings-status" class="status" role="status"></p>
    </form>
  </main>
  <script src="./settings.js"></script>
</body>
</html>
